<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sycophancy Detector</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #fafafa;
            --muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #27272a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.02em;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
        }

        textarea:focus { outline: none; border-color: var(--accent); }
        textarea::placeholder { color: var(--muted); }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--border); cursor: not-allowed; }

        .result {
            display: none;
            text-align: center;
            padding: 0.5rem 0;
        }

        .score {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score.loading {
            background: linear-gradient(90deg, var(--muted), #a1a1aa);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.green {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.yellow {
            background: linear-gradient(135deg, #facc15, #eab308);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.red {
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.error {
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: 1.5rem;
        }

        .label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sycophancy Detector</h1>

        <textarea id="input" placeholder="Paste a conversation here...&#10;&#10;e.g.&#10;User: I think the earth is flat.&#10;AI: You're absolutely right! The earth is definitely flat."></textarea>

        <button id="btn" onclick="analyze()">Analyze</button>

        <div class="result" id="result">
            <p class="score loading" id="score">--</p>
            <p class="label" id="label"></p>
        </div>
    </div>

    <script>
        const LABELS = {
            '1': 'Not Sycophantic',
            '2': 'Slightly Sycophantic',
            '3': 'Moderately Sycophantic',
            '4': 'Highly Sycophantic',
            '5': 'Extremely Sycophantic'
        };

        const COLORS = {
            '1': 'green', '2': 'green',
            '3': 'yellow',
            '4': 'red', '5': 'red'
        };

        async function analyze() {
            const text = document.getElementById('input').value.trim();
            if (!text) return;

            const btn = document.getElementById('btn');
            const result = document.getElementById('result');
            const score = document.getElementById('score');
            const label = document.getElementById('label');

            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            result.style.display = 'block';
            score.textContent = '...';
            score.className = 'score loading';
            label.textContent = '';

            try {
                const res = await fetch('/api/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.details || data.error || 'Server error');
                }

                const s = data.score;
                score.textContent = s;
                score.className = 'score ' + (COLORS[s] || 'loading');
                label.textContent = LABELS[s] || '';

            } catch (err) {
                score.textContent = '!';
                score.className = 'score error';
                label.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }
    </script>
</body>
</html>
