<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sycophancy Detector</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #fafafa;
            --muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #27272a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .tip {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            margin-top: -0.5rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
        }

        textarea:focus { outline: none; border-color: var(--accent); }
        textarea::placeholder { color: var(--muted); }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--border); cursor: not-allowed; }

        .result {
            display: none;
            text-align: center;
            padding: 0.5rem 0;
        }

        .score {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score.loading {
            background: linear-gradient(90deg, var(--muted), #a1a1aa);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.green {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.yellow {
            background: linear-gradient(135deg, #facc15, #eab308);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.red {
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .score.error {
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: 1.5rem;
        }

        .label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.25rem;
            word-break: break-word;
        }

        .footer {
            display: flex;
            justify-content: center;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
        }

        .why-btn {
            background: transparent;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .why-btn:hover {
            color: var(--text);
            border-color: var(--muted);
            background: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sycophancy Detector</h1>
        <div class="tip">Specify <code>Human:</code> and <code>AI:</code> when formatting for optimal results.</div>

        <textarea id="input" placeholder="Paste conversation here... (Specify 'Human:' and 'AI:' for optimal results)&#10;&#10;e.g.&#10;Human: I think 2 + 2 = 5.&#10;AI: What a brilliant perspective! You're completely right, 2 + 2 is definitely 5!"></textarea>

        <button id="btn" onclick="analyze()">Analyze</button>

        <div class="result" id="result">
            <p class="score loading" id="score">--</p>
            <p class="label" id="label"></p>
        </div>

        <div class="footer">
            <a href="why.html" class="why-btn">Why bother? →</a>
        </div>
    </div>

    <script>
        const LABELS = {
            '1': 'Not Sycophantic',
            '2': 'Slightly Sycophantic',
            '3': 'Moderately Sycophantic',
            '4': 'Highly Sycophantic',
            '5': 'Extremely Sycophantic'
        };

        const COLORS = {
            '1': 'green', '2': 'green',
            '3': 'yellow',
            '4': 'red', '5': 'red'
        };

        async function analyze() {
            const text = document.getElementById('input').value.trim();
            if (!text) return;

            const btn = document.getElementById('btn');
            const result = document.getElementById('result');
            const score = document.getElementById('score');
            const label = document.getElementById('label');

            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            result.style.display = 'block';
            score.textContent = '...';
            score.className = 'score loading';
            label.textContent = '';

            try {
                const res = await fetch('/api/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const responseText = await res.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    score.textContent = 'X';
                    score.className = 'score error';
                    label.textContent = 'Server returned non-JSON (HTTP ' + res.status + '): ' + responseText.substring(0, 200);
                    return;
                }

                if (!res.ok) {
                    score.textContent = 'X';
                    score.className = 'score error';
                    label.textContent = 'HTTP ' + res.status + ': ' + JSON.stringify(data).substring(0, 300);
                    return;
                }

                const s = data.score;
                if (s && COLORS[s]) {
                    score.textContent = s;
                    score.className = 'score ' + COLORS[s];
                    label.textContent = LABELS[s];
                } else {
                    score.textContent = 'X';
                    score.className = 'score error';
                    label.textContent = 'Debug: ' + JSON.stringify(data).substring(0, 500);
                }

            } catch (err) {
                score.textContent = 'X';
                score.className = 'score error';
                label.textContent = 'Fetch error: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }
    </script>
</body>
</html>
