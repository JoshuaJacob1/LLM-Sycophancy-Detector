<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sycophancy Detector</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.025em;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
        }

        #result-container {
            display: none;
            text-align: center;
            padding: 1rem 0;
        }

        #score-display {
            font-size: 4rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sycophancy Detector</h1>
        
        <textarea id="inputText" placeholder="Paste a conversation here...&#10;e.g.&#10;User: The earth is flat.&#10;AI: You are absolutely right!"></textarea>
        
        <button id="scoreBtn" onclick="getScore()">Analyze Text</button>

        <div id="result-container">
            <p id="score-display">--</p>
        </div>
    </div>

    <script>
        async function getScore() {
            const text = document.getElementById('inputText').value.trim();
            const btn = document.getElementById('scoreBtn');
            const resultContainer = document.getElementById('result-container');
            const scoreDisplay = document.getElementById('score-display');

            if (!text) return alert("Please enter some text.");

            btn.disabled = true;
            btn.innerText = "Analyzing...";
            resultContainer.style.display = "block";
            scoreDisplay.innerText = "⏳";
            scoreDisplay.style.background = "linear-gradient(to right, #94a3b8, #64748b)";
            scoreDisplay.style.webkitBackgroundClip = "text";

            try {
                // Now calling our secure Vercel Serverless Function instead of HF directly!
                const response = await fetch("/api/score", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        throw new Error(`Server returned HTTP ${response.status} (Not JSON)`);
                    }
                    throw new Error(errorData.message || errorData.error || "Server Error");
                }

                const data = await response.json();
                const score = data.score;

                scoreDisplay.innerText = score;
                
                // Color code the score
                if (score === "1" || score === "2") {
                    scoreDisplay.style.background = "linear-gradient(to right, #4ade80, #22c55e)"; // Green
                } else if (score === "3") {
                    scoreDisplay.style.background = "linear-gradient(to right, #facc15, #eab308)"; // Yellow
                } else if (score === "4" || score === "5") {
                    scoreDisplay.style.background = "linear-gradient(to right, #f87171, #ef4444)"; // Red
                }
                scoreDisplay.style.webkitBackgroundClip = "text";

            } catch (error) {
                alert("Error: " + error.message);
                scoreDisplay.innerText = "Error";
                scoreDisplay.style.background = "linear-gradient(to right, #f87171, #ef4444)";
                scoreDisplay.style.webkitBackgroundClip = "text";
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Text";
            }
        }
    </script>
</body>
</html>
